<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Laundry 3D</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap');
        
        body {
            font-family: 'Nunito', sans-serif;
            background-color: #f0f4f8;
            color: #334155;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        /* 3D Card Effect */
        .card-3d {
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05), inset 0 2px 0 rgba(255,255,255,0.8);
            border: 1px solid #e2e8f0;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        
        /* 3D Button Colors */
        .btn-3d-blue {
            background: linear-gradient(145deg, #60a5fa, #3b82f6);
            box-shadow: 0 6px 0 #2563eb, 0 10px 10px rgba(37,99,235,0.3);
            color: white;
        }
        .btn-3d-blue:active { transform: translateY(6px); box-shadow: 0 0px 0 #2563eb, 0 4px 4px rgba(37,99,235,0.3); }

        .btn-3d-green {
            background: linear-gradient(145deg, #34d399, #10b981);
            box-shadow: 0 6px 0 #059669, 0 10px 10px rgba(16,185,129,0.3);
            color: white;
        }
        .btn-3d-green:active { transform: translateY(6px); box-shadow: 0 0px 0 #059669, 0 4px 4px rgba(16,185,129,0.3); }

        .btn-3d-red {
            background: linear-gradient(145deg, #f87171, #ef4444);
            box-shadow: 0 6px 0 #dc2626, 0 10px 10px rgba(239,68,68,0.3);
            color: white;
        }
        .btn-3d-red:active { transform: translateY(6px); box-shadow: 0 0px 0 #dc2626, 0 4px 4px rgba(239,68,68,0.3); }

        .btn-3d-gray {
            background: linear-gradient(145deg, #f1f5f9, #e2e8f0);
            box-shadow: 0 6px 0 #cbd5e1, 0 10px 10px rgba(148,163,184,0.2);
            color: #475569;
        }
        .btn-3d-gray:active { transform: translateY(6px); box-shadow: 0 0px 0 #cbd5e1, 0 4px 4px rgba(148,163,184,0.2); }

        .btn-3d {
            border-radius: 12px;
            padding: 8px 16px;
            font-weight: 800;
            transition: all 0.1s;
            border: none;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            outline: none;
        }

        .icon-3d { filter: drop-shadow(2px 4px 2px rgba(0,0,0,0.2)); font-size: 1.5rem; }

        @media print {
            body * { visibility: hidden; }
            #printable-receipt, #printable-receipt * { visibility: visible; }
            #printable-receipt {
                position: absolute; left: 0; top: 0;
                width: 80mm;
                margin: 0; padding: 10px;
                font-size: 12px; font-family: monospace;
                color: black; background: white;
            }
            .no-print { display: none !important; }
        }
        
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const formatRp = (angka) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(angka || 0);
        const formatDate = (dateStr) => dateStr ? new Date(dateStr).toLocaleString('id-ID', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : '-';

        const STATUS_WORK = ['Antrian', 'Proses', 'Siap Ambil', 'Selesai', 'Batal'];
        const STATUS_PAYMENT = ['Belum Lunas', 'DP', 'Lunas'];

        function App() {
            const [activeTab, setActiveTab] = useState('dashboard');
            const [toast, setToast] = useState('');

            // Data States (Local Storage based for mobile stability)
            const [services, setServices] = useState([]);
            const [customers, setCustomers] = useState([]);
            const [employees, setEmployees] = useState([]);
            const [transactions, setTransactions] = useState([]);
            const [finances, setFinances] = useState([]);
            const [settings, setSettings] = useState({ shopName: 'Laundry 3D', address: 'Jl. Estetik No. 1\nKota Laundry', footerMsg: 'Terima kasih telah mencuci di tempat kami' });

            useEffect(() => {
                loadLocalData();
            }, []);

            const loadLocalData = () => {
                setServices(JSON.parse(localStorage.getItem('l3d_services') || '[]'));
                setCustomers(JSON.parse(localStorage.getItem('l3d_customers') || '[]'));
                setEmployees(JSON.parse(localStorage.getItem('l3d_employees') || '[]'));
                setTransactions(JSON.parse(localStorage.getItem('l3d_transactions') || '[]').sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt)));
                setFinances(JSON.parse(localStorage.getItem('l3d_finances') || '[]').sort((a,b) => new Date(b.date) - new Date(a.date)));
                
                const savedSettings = localStorage.getItem('l3d_settings');
                if(savedSettings) setSettings(JSON.parse(savedSettings));
            };

            const saveLocal = (key, data) => {
                localStorage.setItem(`l3d_${key}`, JSON.stringify(data));
                loadLocalData();
            };

            const showToast = (msg) => {
                setToast(msg);
                setTimeout(() => setToast(''), 3000);
            };

            const addData = (type, data) => {
                const newData = { id: Date.now().toString(), ...data };
                let current = JSON.parse(localStorage.getItem(`l3d_${type}`) || '[]');
                current.push(newData);
                saveLocal(type, current);
                showToast('Data berhasil disimpan');
            };

            const updateData = (type, id, data) => {
                let current = JSON.parse(localStorage.getItem(`l3d_${type}`) || '[]');
                current = current.map(item => item.id === id ? { ...item, ...data } : item);
                saveLocal(type, current);
                showToast('Data berhasil diperbarui');
            };

            const deleteData = (type, id) => {
                let current = JSON.parse(localStorage.getItem(`l3d_${type}`) || '[]');
                current = current.filter(item => item.id !== id);
                saveLocal(type, current);
                showToast('Data berhasil dihapus');
            };

            const DashboardView = () => {
                const totalOmset = transactions.reduce((acc, curr) => {
                    if (curr.paymentStatus === 'Lunas') return acc + curr.total;
                    if (curr.paymentStatus === 'DP') return acc + (curr.dpAmount || 0);
                    return acc;
                }, 0);
                const txMasuk = transactions.filter(t => t.status !== 'Batal').length;
                const txLunas = transactions.filter(t => t.paymentStatus === 'Lunas').length;
                const txBatal = transactions.filter(t => t.status === 'Batal').length;

                return (
                    <div className="space-y-6 pb-24">
                        <div className="bg-gradient-to-r from-blue-500 to-cyan-400 rounded-3xl p-6 text-white shadow-lg relative overflow-hidden">
                            <div className="relative z-10">
                                <h2 className="text-xl font-extrabold mb-1">Total Omset</h2>
                                <p className="text-4xl font-black">{formatRp(totalOmset)}</p>
                            </div>
                            <span className="absolute -right-4 -bottom-4 text-8xl opacity-20">💰</span>
                        </div>

                        <div className="grid grid-cols-3 gap-3">
                            <div className="card-3d p-4 flex flex-col items-center text-center">
                                <span className="icon-3d mb-1">📥</span>
                                <p className="text-gray-500 text-[10px] font-bold uppercase">Masuk</p>
                                <p className="text-xl font-black text-gray-800">{txMasuk}</p>
                            </div>
                            <div className="card-3d p-4 flex flex-col items-center text-center">
                                <span className="icon-3d mb-1">✅</span>
                                <p className="text-gray-500 text-[10px] font-bold uppercase">Lunas</p>
                                <p className="text-xl font-black text-emerald-600">{txLunas}</p>
                            </div>
                            <div className="card-3d p-4 flex flex-col items-center text-center">
                                <span className="icon-3d mb-1">❌</span>
                                <p className="text-gray-500 text-[10px] font-bold uppercase">Batal</p>
                                <p className="text-xl font-black text-red-500">{txBatal}</p>
                            </div>
                        </div>

                        <div className="card-3d p-5">
                            <h3 className="font-extrabold text-lg mb-3">Pekerjaan Terkini</h3>
                            <div className="space-y-3">
                                {transactions.slice(0, 5).map(t => {
                                    const c = customers.find(x => x.id === t.customerId);
                                    return (
                                        <div key={t.id} className="flex justify-between items-center p-3 bg-gray-50 rounded-xl">
                                            <div>
                                                <p className="font-bold text-sm text-gray-800">{c?.name || 'Anonim'}</p>
                                                <p className="text-xs text-gray-500">{formatDate(t.createdAt)}</p>
                                            </div>
                                            <div className="text-right">
                                                <span className={`text-xs px-2 py-1 rounded-md font-bold text-white shadow-sm ${t.status === 'Selesai' ? 'bg-emerald-500' : t.status === 'Batal' ? 'bg-red-500' : 'bg-blue-500'}`}>{t.status}</span>
                                            </div>
                                        </div>
                                    )
                                })}
                                {transactions.length === 0 && <p className="text-center text-sm text-gray-400 py-2">Belum ada transaksi</p>}
                            </div>
                        </div>
                    </div>
                );
            };

            const TransactionsView = () => {
                const [isAdding, setIsAdding] = useState(false);
                const [previewTx, setPreviewTx] = useState(null);
                const [filter, setFilter] = useState('Semua');

                const [selCust, setSelCust] = useState('');
                const [cart, setCart] = useState([]);
                const [payStat, setPayStat] = useState('Belum Lunas');
                const [dp, setDp] = useState('');

                const cartTotal = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);

                const handleSave = () => {
                    if (!selCust || cart.length === 0) return showToast('Pilih pelanggan & layanan!');
                    addData('transactions', {
                        customerId: selCust, items: cart, total: cartTotal,
                        status: 'Antrian', paymentStatus: payStat,
                        dpAmount: payStat === 'DP' ? Number(dp) : (payStat === 'Lunas' ? cartTotal : 0),
                        createdAt: new Date().toISOString()
                    });
                    setIsAdding(false); setCart([]); setSelCust(''); setPayStat('Belum Lunas'); setDp('');
                };

                const handlePrint = (tx) => {
                    setPreviewTx(tx);
                    setTimeout(() => window.print(), 300);
                };

                const handleWA = (tx) => {
                    const c = customers.find(x => x.id === tx.customerId);
                    if (!c || !c.phone) return showToast('Nomor HP pelanggan kosong');
                    const text = `Halo Kak ${c.name},%0A%0ATransaksi Laundry di *${settings.shopName}*%0ATotal: *${formatRp(tx.total)}*%0AStatus Nota: *${tx.paymentStatus}*%0AStatus Pengerjaan: *${tx.status}*%0A%0ATerima kasih!`;
                    window.open(`https://wa.me/${c.phone.replace(/^0/,'62')}?text=${text}`, '_blank');
                };

                const filteredList = filter === 'Semua' ? transactions : transactions.filter(t => t.status === filter);

                return (
                    <div className="space-y-6 pb-24">
                        <div className="flex justify-between items-center">
                            <h2 className="text-xl font-extrabold flex items-center gap-2"><span className="icon-3d">💳</span> Transaksi</h2>
                            <button className="btn-3d btn-3d-blue" onClick={() => setIsAdding(true)}>➕ Baru</button>
                        </div>

                        {isAdding && (
                            <div className="card-3d p-5 bg-blue-50/50 space-y-4">
                                <h3 className="font-bold text-lg">Buat Transaksi Baru</h3>
                                <select className="w-full p-3 rounded-xl border outline-none font-semibold text-gray-700 bg-white" value={selCust} onChange={e=>setSelCust(e.target.value)}>
                                    <option value="">-- Pilih Pelanggan --</option>
                                    {customers.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
                                </select>
                                
                                <select className="w-full p-3 rounded-xl border outline-none font-semibold text-gray-700 bg-white" onChange={e => {
                                    const s = services.find(x => x.id === e.target.value);
                                    if(s) setCart([...cart, { serviceId: s.id, name: s.name, price: Number(s.price), qty: 1, unit: s.unit }]);
                                    e.target.value = '';
                                }}>
                                    <option value="">+ Tambah Layanan</option>
                                    {services.map(s => <option key={s.id} value={s.id}>{s.name} - {formatRp(s.price)}</option>)}
                                </select>

                                <div className="bg-white p-3 rounded-xl border">
                                    {cart.length === 0 && <p className="text-xs text-gray-400 text-center py-2">Belum ada layanan dipilih</p>}
                                    {cart.map((item, idx) => (
                                        <div key={idx} className="flex justify-between items-center mb-2 pb-2 border-b">
                                            <div>
                                                <p className="font-bold text-sm">{item.name}</p>
                                                <p className="text-xs text-gray-500">{formatRp(item.price)}</p>
                                            </div>
                                            <div className="flex items-center gap-2">
                                                <input type="number" className="w-12 p-1 text-center border rounded font-bold" value={item.qty} 
                                                    onChange={(e) => { let c = [...cart]; c[idx].qty = Number(e.target.value); setCart(c); }}/>
                                                <span className="text-xs">{item.unit}</span>
                                                <button onClick={()=>setCart(cart.filter((_,i)=>i!==idx))} className="text-red-500 ml-1">🗑️</button>
                                            </div>
                                        </div>
                                    ))}
                                    <div className="text-right font-black text-blue-600 mt-2 text-base">Total: {formatRp(cartTotal)}</div>
                                </div>

                                <div className="flex gap-2">
                                    <select className="flex-1 p-3 rounded-xl border font-bold text-gray-700 bg-white" value={payStat} onChange={e=>setPayStat(e.target.value)}>
                                        {STATUS_PAYMENT.map(s => <option key={s} value={s}>{s}</option>)}
                                    </select>
                                    {payStat === 'DP' && <input type="number" placeholder="Nominal DP" className="flex-1 p-3 rounded-xl border bg-white" value={dp} onChange={e=>setDp(e.target.value)}/>}
                                </div>

                                <div className="flex gap-2 pt-2">
                                    <button className="btn-3d btn-3d-green flex-1" onClick={handleSave}>Simpan</button>
                                    <button className="btn-3d btn-3d-gray" onClick={()=>setIsAdding(false)}>Batal</button>
                                </div>
                            </div>
                        )}

                        <div className="flex gap-2 overflow-x-auto pb-2">
                            {['Semua', ...STATUS_WORK].map(s => (
                                <button key={s} onClick={()=>setFilter(s)} className={`px-4 py-2 rounded-full font-bold text-sm whitespace-nowrap shadow-sm ${filter === s ? 'bg-gray-800 text-white' : 'bg-white text-gray-600'}`}>{s}</button>
                            ))}
                        </div>

                        <div className="space-y-4">
                            {filteredList.map(tx => {
                                const cust = customers.find(c => c.id === tx.customerId);
                                return (
                                    <div key={tx.id} className="card-3d p-4">
                                        <div className="flex justify-between items-start mb-3">
                                            <div>
                                                <p className="font-extrabold text-lg text-gray-800">{cust?.name || 'Anonim'}</p>
                                                <p className="text-xs text-gray-500 font-semibold">{formatDate(tx.createdAt)}</p>
                                            </div>
                                            <div className="text-right">
                                                <p className="font-black text-lg text-blue-600">{formatRp(tx.total)}</p>
                                                {tx.paymentStatus === 'DP' && <p className="text-xs text-orange-500 font-bold">DP: {formatRp(tx.dpAmount)}</p>}
                                            </div>
                                        </div>

                                        <div className="flex gap-2 mb-3">
                                            <select className="p-2 text-xs rounded-lg border font-bold bg-gray-50 flex-1 outline-none" value={tx.status} onChange={e=>updateData('transactions', tx.id, {status: e.target.value})}>
                                                {STATUS_WORK.map(s => <option key={s} value={s}>{s}</option>)}
                                            </select>
                                            <select className={`p-2 text-xs rounded-lg border font-bold flex-1 outline-none ${tx.paymentStatus === 'Lunas' ? 'bg-emerald-50 text-emerald-700' : 'bg-red-50 text-red-700'}`} value={tx.paymentStatus} onChange={e=>updateData('transactions', tx.id, {paymentStatus: e.target.value})}>
                                                {STATUS_PAYMENT.map(s => <option key={s} value={s}>{s}</option>)}
                                            </select>
                                        </div>

                                        <div className="flex gap-2 border-t pt-3">
                                            <button onClick={()=>handlePrint(tx)} className="btn-3d btn-3d-gray flex-1 text-sm py-2">🖨️ Cetak</button>
                                            <button onClick={()=>handleWA(tx)} className="btn-3d btn-3d-green flex-1 text-sm py-2">💬 WA</button>
                                        </div>
                                    </div>
                                )
                            })}
                            {filteredList.length === 0 && <p className="text-center text-gray-400 py-6 font-bold">Tidak ada transaksi ditemukan</p>}
                        </div>

                        {previewTx && (
                            <div id="printable-receipt" className="no-print">
                                <div style={{ textAlign: 'center', marginBottom: '10px' }}>
                                    <h2 style={{ margin: 0, fontSize: '16px' }}>{settings.shopName}</h2>
                                    <p style={{ margin: 0, fontSize: '10px', whiteSpace: 'pre-line' }}>{settings.address}</p>
                                    <p style={{ margin: 0, fontSize: '10px', borderBottom: '1px dashed #000', paddingBottom: '5px' }}>Tgl: {formatDate(previewTx.createdAt)}</p>
                                </div>
                                <p style={{ margin: '5px 0' }}>Cust: {customers.find(c=>c.id===previewTx.customerId)?.name || 'Anonim'}</p>
                                <p style={{ margin: '5px 0' }}>Status: {previewTx.paymentStatus}</p>
                                <table style={{ width: '100%', marginTop: '10px', borderCollapse: 'collapse' }}>
                                    <tbody>
                                        {previewTx.items.map((it, i) => (
                                            <tr key={i}>
                                                <td style={{ padding: '2px 0' }}>{it.name} <br/><small>{it.qty} {it.unit} x {formatRp(it.price)}</small></td>
                                                <td style={{ textAlign: 'right', verticalAlign: 'top' }}>{formatRp(it.qty * it.price)}</td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                                <div style={{ borderTop: '1px dashed #000', margin: '10px 0', paddingTop: '5px', textAlign: 'right', fontWeight: 'bold' }}>
                                    Total: {formatRp(previewTx.total)}
                                    {previewTx.paymentStatus === 'DP' && <><br/>DP: {formatRp(previewTx.dpAmount)}</>}
                                </div>
                                <div style={{ textAlign: 'center', marginTop: '15px', fontSize: '10px' }}>{settings.footerMsg}</div>
                            </div>
                        )}
                    </div>
                );
            };

            const MasterDataView = ({ type }) => {
                const [form, setForm] = useState({});
                const [isEdit, setIsEdit] = useState(false);

                const config = {
                    services: { title: 'Layanan', icon: '👕', data: services, fields: [{n:'name',l:'Nama Layanan'},{n:'category',l:'Kategori'},{n:'price',l:'Harga (Rp)',t:'number'},{n:'unit',l:'Satuan (Kg/Pcs)'}] },
                    customers: { title: 'Pelanggan', icon: '👥', data: customers, fields: [{n:'name',l:'Nama Lengkap'},{n:'phone',l:'No HP/WA'},{n:'address',l:'Alamat'}] },
                    employees: { title: 'Karyawan', icon: '🧑‍💼', data: employees, fields: [{n:'name',l:'Nama Karyawan'},{n:'role',l:'Tugas/Jabatan'},{n:'phone',l:'No HP'}] }
                }[type];

                const handleSubmit = (e) => {
                    e.preventDefault();
                    if(form.id) updateData(type, form.id, form);
                    else addData(type, form);
                    setIsEdit(false); setForm({});
                };

                return (
                    <div className="space-y-6 pb-24">
                        <div className="flex justify-between items-center">
                            <h2 className="text-xl font-extrabold flex items-center gap-2"><span className="icon-3d">{config.icon}</span> Data {config.title}</h2>
                            <button className="btn-3d btn-3d-blue" onClick={()=>{setIsEdit(true);setForm({});}}>➕ Tambah</button>
                        </div>

                        {isEdit && (
                            <form onSubmit={handleSubmit} className="card-3d p-5 space-y-4">
                                <h3 className="font-bold text-lg">{form.id ? 'Edit' : 'Tambah'} {config.title}</h3>
                                {config.fields.map(f => (
                                    <div key={f.n}>
                                        <label className="block text-xs font-bold text-gray-500 mb-1">{f.l}</label>
                                        <input type={f.t||'text'} required className="w-full p-3 rounded-xl border outline-none bg-white" value={form[f.n]||''} onChange={e=>setForm({...form, [f.n]: e.target.value})}/>
                                    </div>
                                ))}
                                <div className="flex gap-2 pt-2">
                                    <button type="submit" className="btn-3d btn-3d-green flex-1">Simpan</button>
                                    <button type="button" className="btn-3d btn-3d-gray flex-1" onClick={()=>setIsEdit(false)}>Batal</button>
                                </div>
                            </form>
                        )}

                        <div className="grid gap-3">
                            {config.data.map(item => (
                                <div key={item.id} className="card-3d p-4 flex justify-between items-center">
                                    <div>
                                        <p className="font-extrabold text-base text-gray-800">{item.name}</p>
                                        <p className="text-xs text-gray-500 mt-0.5">{item.price ? formatRp(item.price) + ` / ${item.unit}` : (item.phone || item.role || '-')}</p>
                                    </div>
                                    <div className="flex gap-2">
                                        <button onClick={()=>{setForm(item);setIsEdit(true)}} className="btn-3d btn-3d-gray !p-2">✏️</button>
                                        <button onClick={()=>{if(confirm('Yakin ingin menghapus data ini?')) deleteData(type, item.id)}} className="btn-3d btn-3d-red !p-2">🗑️</button>
                                    </div>
                                </div>
                            ))}
                            {config.data.length === 0 && <p className="text-center text-gray-400 py-6 font-bold">Belum ada data</p>}
                        </div>
                    </div>
                );
            };

            const FinanceView = () => {
                const [form, setForm] = useState({ type: 'income', amount: '', desc: '' });
                const saldo = finances.reduce((acc, curr) => curr.type === 'income' ? acc + Number(curr.amount) : acc - Number(curr.amount), 0);

                const handleSave = (e) => {
                    e.preventDefault();
                    addData('finances', { ...form, date: new Date().toISOString() });
                    setForm({ type: 'income', amount: '', desc: '' });
                };

                return (
                    <div className="space-y-6 pb-24">
                        <div className="card-3d p-6 bg-gradient-to-br from-green-400 to-emerald-600 text-white text-center shadow-lg">
                            <p className="text-xs font-bold opacity-80 uppercase tracking-wide">Saldo Kas</p>
                            <h2 className="text-3xl font-black mt-1">{formatRp(saldo)}</h2>
                        </div>

                        <form onSubmit={handleSave} className="card-3d p-5 space-y-4">
                            <h3 className="font-bold text-lg border-b pb-2">Catat Kas Baru</h3>
                            <div className="flex gap-2">
                                <select className="p-3 rounded-xl border font-bold flex-1 bg-white outline-none" value={form.type} onChange={e=>setForm({...form, type: e.target.value})}>
                                    <option value="income">Pemasukan (+)</option>
                                    <option value="expense">Pengeluaran (-)</option>
                                </select>
                                <input type="number" required placeholder="Nominal Rp" className="p-3 rounded-xl border flex-1 outline-none bg-white" value={form.amount} onChange={e=>setForm({...form, amount: e.target.value})}/>
                            </div>
                            <input type="text" required placeholder="Keterangan (cth: Beli sabun)..." className="w-full p-3 rounded-xl border outline-none bg-white" value={form.desc} onChange={e=>setForm({...form, desc: e.target.value})}/>
                            <button className="w-full btn-3d btn-3d-blue py-3">Simpan Catatan</button>
                        </form>

                        <div className="space-y-3">
                            {finances.map(f => (
                                <div key={f.id} className="card-3d p-4 flex justify-between items-center">
                                    <div>
                                        <p className="font-bold text-sm text-gray-800">{f.desc}</p>
                                        <p className="text-[10px] text-gray-400">{formatDate(f.date)}</p>
                                    </div>
                                    <p className={`font-black text-sm ${f.type === 'income' ? 'text-green-600' : 'text-red-500'}`}>
                                        {f.type === 'income' ? '+' : '-'}{formatRp(f.amount)}
                                    </p>
                                </div>
                            ))}
                            {finances.length === 0 && <p className="text-center text-gray-400 py-6 font-bold">Belum ada riwayat keuangan</p>}
                        </div>
                    </div>
                );
            };

            const SettingsView = () => {
                const [form, setForm] = useState(settings);
                
                const handleSave = (e) => {
                    e.preventDefault();
                    localStorage.setItem('l3d_settings', JSON.stringify(form));
                    setSettings(form);
                    showToast('Pengaturan disimpan!');
                };

                return (
                    <div className="space-y-6 pb-24">
                        <div className="card-3d p-5 bg-gradient-to-br from-gray-800 to-gray-900 text-white">
                            <h2 className="font-black text-base flex items-center gap-2"><span className="text-xl">🖨️</span> Printer & Struk</h2>
                            <p className="text-xs text-gray-300 mt-1">Gunakan tombol 'Cetak' di menu transaksi untuk mengirim struk ke printer thermal Bluetooth Anda.</p>
                        </div>

                        <form onSubmit={handleSave} className="card-3d p-5 space-y-4">
                            <div>
                                <label className="block text-xs font-bold text-gray-500 mb-1">Nama Toko</label>
                                <input type="text" className="w-full p-3 rounded-xl border bg-white outline-none" value={form.shopName} onChange={e=>setForm({...form, shopName: e.target.value})}/>
                            </div>
                            <div>
                                <label className="block text-xs font-bold text-gray-500 mb-1">Alamat (Bisa baris baru)</label>
                                <textarea rows="3" className="w-full p-3 rounded-xl border bg-white outline-none" value={form.address} onChange={e=>setForm({...form, address: e.target.value})}></textarea>
                            </div>
                            <div>
                                <label className="block text-xs font-bold text-gray-500 mb-1">Pesan Penutup Struk</label>
                                <input type="text" className="w-full p-3 rounded-xl border bg-white outline-none" value={form.footerMsg} onChange={e=>setForm({...form, footerMsg: e.target.value})}/>
                            </div>
                            <button className="w-full btn-3d btn-3d-green py-3">Simpan Desain Struk</button>
                        </form>

                        <div className="card-3d p-5 flex flex-col items-center">
                            <h3 className="font-bold mb-3 w-full text-left text-gray-500 text-sm">Preview Visual Struk</h3>
                            <div className="bg-[#fffdf2] p-4 border border-dashed border-gray-400 w-full max-w-[280px] shadow-sm font-mono text-xs text-black">
                                <div className="text-center mb-2">
                                    <h4 className="font-bold text-sm m-0">{form.shopName}</h4>
                                    <p className="whitespace-pre-line m-0 text-[10px]">{form.address}</p>
                                    <p className="mt-1 border-b border-dashed border-gray-400 pb-1 m-0 text-[10px]">Tgl: 12 Okt 2026 10:00</p>
                                </div>
                                <p className="m-0 py-1">Cust: Bpk. Contoh</p>
                                <table className="w-full mt-2 border-collapse">
                                    <tbody>
                                        <tr><td className="pb-1">Cuci Komplit<br/><small>2 Kg x 6.000</small></td><td className="text-right align-top">12.000</td></tr>
                                    </tbody>
                                </table>
                                <div className="border-t border-dashed border-gray-400 mt-2 pt-2 text-right font-bold">Total: 12.000</div>
                                <div className="text-center mt-3 text-[10px]">{form.footerMsg}</div>
                            </div>
                        </div>
                    </div>
                );
            };

            const tabs = [
                { id: 'dashboard', i: '📊', l: 'Ringkasan' },
                { id: 'transactions', i: '💳', l: 'Transaksi' },
                { id: 'services', i: '👕', l: 'Layanan' },
                { id: 'customers', i: '👥', l: 'Pelanggan' },
                { id: 'employees', i: '🧑‍💼', l: 'Karyawan' },
                { id: 'finance', i: '💰', l: 'Keuangan' },
                { id: 'settings', i: '🖨️', l: 'Struk' },
            ];

            return (
                <div className="min-h-screen w-full relative">
                    <header className="bg-white/90 backdrop-blur-md sticky top-0 z-30 p-4 flex items-center justify-between shadow-sm border-b">
                        <div className="flex items-center gap-2">
                            <span className="icon-3d text-2xl">🧺</span>
                            <h1 className="font-black text-xl bg-clip-text text-transparent bg-gradient-to-r from-blue-600 to-cyan-500">Laundry 3D</h1>
                        </div>
                        <div className="text-xs font-bold text-emerald-600 bg-emerald-50 px-2.5 py-1 rounded-full border border-emerald-200">
                            ● Ready Offline
                        </div>
                    </header>

                    <main className="p-4 max-w-md mx-auto relative">
                        {activeTab === 'dashboard' && <DashboardView />}
                        {activeTab === 'transactions' && <TransactionsView />}
                        {activeTab === 'services' && <MasterDataView type="services" />}
                        {activeTab === 'customers' && <MasterDataView type="customers" />}
                        {activeTab === 'employees' && <MasterDataView type="employees" />}
                        {activeTab === 'finance' && <FinanceView />}
                        {activeTab === 'settings' && <SettingsView />}
                    </main>

                    <nav className="fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur-md border-t shadow-[0_-10px_20px_rgba(0,0,0,0.05)] z-40 pb-safe">
                        <div className="flex overflow-x-auto p-2 no-scrollbar gap-1 max-w-md mx-auto justify-around">
                            {tabs.map(t => (
                                <button key={t.id} onClick={() => setActiveTab(t.id)} className={`flex flex-col items-center min-w-[55px] p-1.5 rounded-xl transition-all ${activeTab === t.id ? 'bg-blue-50 text-blue-600 font-black scale-105' : 'text-gray-400 font-semibold'}`}>
                                    <span className="text-lg mb-0.5">{t.i}</span>
                                    <span className="text-[9px] tracking-tight">{t.l}</span>
                                </button>
                            ))}
                        </div>
                    </nav>

                    {toast && (
                        <div className="fixed top-20 left-1/2 transform -translate-x-1/2 z-50 bg-gray-800 text-white px-5 py-2.5 rounded-full shadow-xl font-bold flex items-center gap-2 text-xs whitespace-nowrap animate-bounce">
                            ✅ {toast}
                        </div>
                    )}
                    
                    <style>{`.pb-safe { padding-bottom: env(safe-area-inset-bottom); } .no-scrollbar::-webkit-scrollbar { display: none; }`}</style>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
